name: Stabilization Patch Applicator

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stabilization-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply deterministic cleanup
        run: python3 scripts/stabilization_cleanup.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit corrections when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add crates/goose/src/oauth/mod.rs
          git commit -m "fix(stability): clean temporary patch duplication [stabilization-applied]"
          git push origin HEAD:hivecode/wo-0002c-stabilization
