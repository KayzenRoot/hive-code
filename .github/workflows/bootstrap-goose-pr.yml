name: Bootstrap Goose Import PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-goose-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Import Goose main history into a non-destructive branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --bare --single-branch --branch main https://github.com/aaif-goose/goose.git goose.git
          cd goose.git
          git remote add hive "https://x-access-token:${GH_TOKEN}@github.com/KayzenRoot/hive-code.git"
          git push hive refs/heads/main:refs/heads/goose-main
