name: Stabilization Wave 7

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave7-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply crash-resume and compatibility corrections
        run: python3 scripts/stabilization_wave7.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate ambiguous-resume fail-closed behavior
        run: cargo test -p goose state_machine_confirmation_through_agent_resumes_tool_call --locked
      - name: Validate MCP client tests
        run: cargo test -p goose mcp_client --locked
      - name: Commit bounded corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add \
            crates/goose/src/agents/agent.rs \
            crates/goose/src/agents/state_machine/tests/agent_reply.rs \
            crates/goose/src/config/permission.rs
          git commit -m "fix(stability): fail closed on ambiguous resume and restore MCP negotiation [wave7-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
