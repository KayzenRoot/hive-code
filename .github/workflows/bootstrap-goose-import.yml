name: Bootstrap Hive Code from Goose

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hive-code-bootstrap
  cancel-in-progress: false

jobs:
  mirror-goose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mirror aaif-goose/goose into Hive Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/aaif-goose/goose.git goose.git
          cd goose.git
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/KayzenRoot/hive-code.git"
          git push --mirror --force origin
