name: Stabilization Wave 12

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[wave12-trigger]') && !contains(github.event.head_commit.message, '[wave12-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply bounded correction
        run: python3 scripts/stabilization_wave12.py
      - name: Format
        run: cargo fmt --all
      - name: Focused manager regression tests
        run: cargo test -p goose execution::manager::tests --locked
      - name: Commit exact correction
        run: |
          if git diff --quiet; then
            echo 'No mutation required.'
            exit 0
          fi
          git config user.name 'KayzenRoot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/goose/src/execution/manager.rs
          git commit -m 'fix(stabilization): preserve valid providerless session lifecycle [wave12-applied]'
          git push origin HEAD:hivecode/wo-0002c-stabilization
