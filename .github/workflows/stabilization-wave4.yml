name: Stabilization Wave 4

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply image ordering correction
        run: python3 scripts/stabilization_wave4.py
      - name: Format
        run: cargo fmt --all
      - name: Targeted regression test
        run: cargo test -p goose-provider-types test_merge_split_tool_calls_with_image_gap --locked
      - name: Commit source correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add crates/goose-provider-types/src/formats/openai.rs
          git commit -m "fix(provider): keep parallel tool image results protocol-valid [wave4-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
