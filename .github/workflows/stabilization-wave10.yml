name: Stabilization Wave 10

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave10-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply OAuth credential safety correction
        run: python3 scripts/stabilization_wave10.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate OAuth policy tests
        run: cargo test -p goose refresh_failure_only_clears_on_definitive_rejection --locked
      - name: Validate OAuth rotation guard
        run: cargo test -p goose credential_snapshot_comparison_detects_concurrent_rotation --locked
      - name: Validate OAuth persistence tests
        run: cargo test -p goose oauth::persist::tests --locked
      - name: Check affected crate
        run: cargo check -p goose --locked
      - name: Commit bounded correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add crates/goose/src/oauth/mod.rs crates/goose/src/oauth/persist.rs
          git commit -m "fix(oauth): preserve transient credentials and clear rejected tokens safely [wave10-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
