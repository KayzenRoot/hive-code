name: Stabilization Wave 8

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave8-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply provider stream duration cap
        run: python3 scripts/stabilization_wave8.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate stream cap unit tests
        run: cargo test -p goose-provider-types stream_cap --locked
      - name: Check affected provider crates
        run: cargo check -p goose-provider-types -p goose-providers -p goose --locked
      - name: Commit bounded correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add \
            crates/goose-provider-types/src/stream_cap.rs \
            crates/goose-provider-types/src/lib.rs \
            crates/goose-provider-types/src/base.rs \
            crates/goose-provider-types/Cargo.toml \
            crates/goose-providers/src/lib.rs \
            crates/goose/src/agents/reply_parts.rs \
            crates/goose/src/providers/githubcopilot.rs
          git commit -m "fix(providers): cap stalled provider response duration [wave8-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
