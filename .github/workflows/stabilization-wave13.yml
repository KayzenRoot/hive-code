name: Stabilization Wave 13

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  acp-permission-fix:
    name: wave13 / ACP permission persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply test isolation correction
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("crates/goose/tests/acp_common_tests/mod.rs")
          text = path.read_text()
          pattern = re.compile(
              r"pub async fn run_permission_persistence<C: Connection>\(\) \{.*?\n\}\n\npub async fn run_prompt_basic<C: Connection>\(\)",
              re.S,
          )
          replacement = r'''pub async fn run_permission_persistence<C: Connection>() {
              let cases = vec![
                  (
                      PermissionDecision::AllowAlways,
                      ToolCallStatus::Completed,
                      "user:\n  always_allow:\n  - mcp-fixture__get_code\n  ask_before: []\n  never_allow: []\n",
                  ),
                  (PermissionDecision::AllowOnce, ToolCallStatus::Completed, ""),
                  (
                      PermissionDecision::RejectAlways,
                      ToolCallStatus::Failed,
                      "user:\n  always_allow: []\n  ask_before: []\n  never_allow:\n  - mcp-fixture__get_code\n",
                  ),
                  (PermissionDecision::RejectOnce, ToolCallStatus::Failed, ""),
                  (PermissionDecision::Cancel, ToolCallStatus::Failed, ""),
              ];

              let temp_dir = tempfile::tempdir().unwrap();
              let prompt = "Use the get_code tool and output only its result.";
              let mcp = McpFixture::new().await;

              // The canned OpenAI response intentionally reuses one tool_call_id. Anti-replay
              // protection scopes confirmation IDs to an ACP session, so each independent
              // persistence decision must run through a fresh ACP connection/session instead of
              // replaying that ID five times through one live Agent router.
              for (decision, expected_status, expected_yaml) in cases {
                  let _ = fs::remove_file(temp_dir.path().join("permission.yaml"));
                  let expected_session_id = C::expected_session_id();
                  let openai = OpenAiFixture::new(
                      vec![
                          (
                              prompt.to_string(),
                              include_str!("../acp_test_data/openai_tool_call.txt"),
                          ),
                          (
                              format!(r#""content":"{FAKE_CODE}""#),
                              include_str!("../acp_test_data/openai_tool_result.txt"),
                          ),
                      ],
                      expected_session_id.clone(),
                  )
                  .await;

                  let config = TestConnectionConfig {
                      mcp_servers: vec![McpServer::Http(McpServerHttp::new("mcp-fixture", &mcp.url))],
                      goose_mode: GooseMode::Approve,
                      data_root: temp_dir.path().to_path_buf(),
                      ..Default::default()
                  };

                  let mut conn = C::new(config, openai).await;
                  conn.reset_permissions();
                  let SessionData { mut session, .. } = conn.new_session().await.unwrap();
                  expected_session_id.set(&session.session_id().0);

                  let output = session.prompt(prompt, decision).await.unwrap();
                  assert_eq!(output.tool_status.unwrap(), expected_status);
                  assert_eq!(
                      fs::read_to_string(temp_dir.path().join("permission.yaml")).unwrap_or_default(),
                      expected_yaml,
                  );
                  expected_session_id.assert_matches(&session.session_id().0);
              }
          }

          pub async fn run_prompt_basic<C: Connection>()'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count == 0:
              print("permission persistence function already corrected; no patch needed")
          elif count == 1:
              path.write_text(updated)
              print("applied ACP permission persistence test isolation correction")
          else:
              raise SystemExit(f"unexpected replacement count: {count}")

      - name: Format
        run: cargo fmt --all

      - name: ACP provider permission regression
        run: cargo test -p goose --locked --test acp_provider_test test_permission_persistence -- --nocapture

      - name: ACP server permission regression
        run: cargo test -p goose --locked --test acp_server_test test_permission_persistence -- --nocapture

      - name: Commit validated correction
        run: |
          if git diff --quiet -- crates/goose/tests/acp_common_tests/mod.rs; then
            echo "No source correction to commit"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/goose/tests/acp_common_tests/mod.rs
          git commit -m "test(acp): isolate permission persistence anti-replay cases"
          git push origin HEAD:hivecode/wo-0002c-stabilization
