name: Stabilization Wave 5

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply reliability corrections
        run: python3 scripts/stabilization_wave5.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Check Rust targets
        run: cargo check -p goose --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Desktop typecheck
        working-directory: ui/desktop
        run: pnpm run typecheck
      - name: Commit source corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add \
            crates/goose/src/session/session_manager.rs \
            crates/goose/src/config/permission.rs \
            .devcontainer/Dockerfile \
            ui/desktop/src/components/alerts/AlertBox.tsx
          git commit -m "fix(stability): harden timestamps config and compact settings [wave5-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
