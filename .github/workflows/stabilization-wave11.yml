name: Stabilization Wave 11

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[wave10-applied]') && !contains(github.event.head_commit.message, '[wave11-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply Rust gate hygiene
        run: python3 scripts/stabilization_wave11.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install workspace dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Regenerate canonical English i18n catalog
        working-directory: ui/desktop
        run: pnpm run i18n:extract
      - name: Validate desktop lint gate
        working-directory: ui/desktop
        run: pnpm run lint:check
      - name: Validate Rust Clippy gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit bounded CI hygiene
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add \
            crates/goose-cli/src/recipes/extract_from_cli.rs \
            crates/goose/src/agents/state_machine/tests/agent_reply.rs \
            ui/desktop/src/i18n/messages/*.json
          if git diff --cached --quiet; then
            echo "No staged correction delta"
            exit 0
          fi
          git commit -m "fix(ci): restore lint and clippy gates [wave11-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
