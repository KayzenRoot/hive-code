name: Stabilization Diagnostic

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: read

jobs:
  goose-oauth:
    name: diag / goose oauth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p goose oauth --locked -- --nocapture

  goose-recipe:
    name: diag / goose recipe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
