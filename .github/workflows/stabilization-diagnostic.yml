name: Stabilization Diagnostic

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: read

jobs:
  oauth:
    name: diag / oauth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: OAuth tests
        run: |
          cargo test -p goose --locked oauth -- --nocapture

  recipe:
    name: diag / recipe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Recipe tests
        run: |
          cargo test -p goose --locked recipe -- --nocapture

  permission:
    name: diag / permission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Permission tests
        run: |
          cargo test -p goose --locked permission -- --nocapture

  session:
    name: diag / session
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Session tests
        run: |
          cargo test -p goose --locked session -- --nocapture

  subagent:
    name: diag / subagent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Subagent tests
        run: |
          cargo test -p goose --locked subagent -- --nocapture

  mcp:
    name: diag / mcp
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: MCP tests
        run: |
          cargo test -p goose --locked mcp -- --nocapture

  full:
    name: diag / goose full control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Full goose crate
        run: |
          cargo test -p goose --locked -- --nocapture
