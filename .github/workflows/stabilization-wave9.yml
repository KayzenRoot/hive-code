name: Stabilization Wave 9

on:
  push:
    branches:
      - hivecode/wo-0002c-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave9-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hivecode/wo-0002c-stabilization
          fetch-depth: 0
      - name: Apply thinking-only response correction
        run: python3 scripts/stabilization_wave9.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate state-machine thinking-only behavior
        run: cargo test -p goose-agent thinking_without_answer_is_an_empty_response --locked
      - name: Check affected agent crates
        run: cargo check -p goose-agent -p goose --locked
      - name: Commit bounded correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction delta"
            exit 0
          fi
          git config user.name "KayzenRoot"
          git config user.email "114633702+KayzenRoot@users.noreply.github.com"
          git add crates/goose-agent/src/inference.rs
          git commit -m "fix(agent): treat thinking-only turns as unanswered [wave9-applied]"
          git pull --rebase origin hivecode/wo-0002c-stabilization
          git push origin HEAD:hivecode/wo-0002c-stabilization
